
#theme = "github_light"
theme = "andromeda"
#theme = "acme"

[editor.soft-wrap]
enable = true
wrap-indicator = "\t"

[editor]
review-agent = "codex"
continue-comments = true
scroll-lines = 1
gutters = ["diagnostics", "spacer", "diff"]
# Run Bash without login startup files, which can invoke interactive bind setup.
# BASH_ENV tells noninteractive Bash to source ~/bashrc for shared functions and
# environment settings; Bash expands $HOME in this value.
shell = ["env", "BASH_ENV=$HOME/bashrc", "bash", "-c"]
end-of-line-diagnostics = "disable"
auto-completion = true
completion-trigger-len = 3  
#completion-auto-select=true


completion-display = "statusline"
completion-mouse-append-whitespace = true


auto-reload = true

[editor.cursorline]
normal = true
insert = false
select = false

[editor.statusline]
left = ["mode", "spinner", "completion-suggestions", "file-name", "read-only-indicator",
  "file-modification-indicator"]


[keys.insert]
# Auto-indent on Enter without continuing comment/list tokens: <C-j> runs
# insert_newline (computing indentation), x ensures a non-whitespace char is
# before the cursor, and <C-u> (kill_to_line_start) deletes back to the first
# non-whitespace char on the line (stripping any continued comment token plus x
# while keeping the leading indentation). o/O and Ctrl-j still continue tokens.
ret = "@<C-j>x<C-u>"
# Press 'jk' quickly to leave insert mode
#"a" = { "a" = "normal_mode" }
# "j" = { "k" = "normal_mode" }
"h" = { "h" = "normal_mode" }

[keys.normal]
C-4 = ":run-shell-command echo -n \"%(buffer_name)\" | xclip -selection clipboard"
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"

# td stamp keys (docs/keys.md): move the line's stamp, or a time-log entry's date/start/end, later / earlier by the part under
# the cursor; on the week summary view (space , L), show the next / previous week
"+" = [":echo %sh{mkdir -p ~/.cache/td; echo %{cursor_column} >~/.cache/td/stamp-col}", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td shift +1 --col $(cat ~/.cache/td/stamp-col) --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", ":earlier %sh{p=\"${BASH_EXECUTION_STRING#*'; exit #' }\"; [ \"$p\" -ef ~/.cache/tl/summary.txt ] || [ \"$p\" -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0; exit # %{buffer_name}}", "collapse_selection", ":open -- %sh{printf '%%s:%%s:%%s\\n' \"${BASH_EXECUTION_STRING#*'; exit #' }\" %{cursor_line} \"$(cat ~/.cache/td/stamp-col)\"; exit # %{buffer_name}}", ":echo ''"]
"-" = [":echo %sh{mkdir -p ~/.cache/td; echo %{cursor_column} >~/.cache/td/stamp-col}", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td shift -1 --col $(cat ~/.cache/td/stamp-col) --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", ":earlier %sh{p=\"${BASH_EXECUTION_STRING#*'; exit #' }\"; [ \"$p\" -ef ~/.cache/tl/summary.txt ] || [ \"$p\" -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0; exit # %{buffer_name}}", "collapse_selection", ":open -- %sh{printf '%%s:%%s:%%s\\n' \"${BASH_EXECUTION_STRING#*'; exit #' }\" %{cursor_line} \"$(cat ~/.cache/td/stamp-col)\"; exit # %{buffer_name}}", ":echo ''"]

[keys.normal.g]
    "\\" = ":sh echo 'https://...myaddress.../-/blob/master/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
    "|" = ":sh echo 'https://...myaddress.../-/blob/'$(git branch --show-current)'/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"

[keys.normal.space."."]
"." = ":insert-output date +\"<%%Y-%%m-%%d %%a>\""
m = ":sh echo 'https://ADDRESS/-/blob/master/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
b = ":sh echo 'https://ADDRESS/-/blob/'$(git branch --show-current)'/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
# Plain checkbox toggle [ ] ↔ [X] for any file; td's own is space , x (docs/keys.md)
x = ["extend_to_line_bounds", ":pipe sed 's/^\\([^[]*\\)\\[ \\]/\\1[X]/; t; s/^\\([^[]*\\)\\[[xX]\\]/\\1[ ]/'", ":write"]


# Buffer-specific conversations: editable live output through agent-buffer-lsp.
# Uppercase starts; lowercase resumes. space . q cancels this conversation.
# Keep the capture suffix: Bash exits before treating the buffer name as metadata.
v = ["keep_primary_selection", ":pipe-to python3 ~/.config/helix/bin/agent-buffer capture codex resume --line-start %{selection_line_start} --buffer-context \"$BASH_EXECUTION_STRING\"; exit # helix-agent-buffer: %{buffer_name}", "save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer header", "jump_backward", ":open %sh{python3 ~/.config/helix/bin/agent-buffer prepare}", ":set-language agent-chat", "goto_file_end", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer start}"]
V = ["keep_primary_selection", ":pipe-to python3 ~/.config/helix/bin/agent-buffer capture codex new --line-start %{selection_line_start} --buffer-context \"$BASH_EXECUTION_STRING\"; exit # helix-agent-buffer: %{buffer_name}", "save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer header", "jump_backward", ":open %sh{python3 ~/.config/helix/bin/agent-buffer prepare}", ":set-language agent-chat", "goto_file_end", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer start}"]
c = ["keep_primary_selection", ":pipe-to python3 ~/.config/helix/bin/agent-buffer capture claude resume --line-start %{selection_line_start} --buffer-context \"$BASH_EXECUTION_STRING\"; exit # helix-agent-buffer: %{buffer_name}", "save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer header", "jump_backward", ":open %sh{python3 ~/.config/helix/bin/agent-buffer prepare}", ":set-language agent-chat", "goto_file_end", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer start}"]
C = ["keep_primary_selection", ":pipe-to python3 ~/.config/helix/bin/agent-buffer capture claude new --line-start %{selection_line_start} --buffer-context \"$BASH_EXECUTION_STRING\"; exit # helix-agent-buffer: %{buffer_name}", "save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer header", "jump_backward", ":open %sh{python3 ~/.config/helix/bin/agent-buffer prepare}", ":set-language agent-chat", "goto_file_end", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer start}"]
g = ["keep_primary_selection", ":pipe-to python3 ~/.config/helix/bin/agent-buffer capture grok resume --line-start %{selection_line_start} --buffer-context \"$BASH_EXECUTION_STRING\"; exit # helix-agent-buffer: %{buffer_name}", "save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer header", "jump_backward", ":open %sh{python3 ~/.config/helix/bin/agent-buffer prepare}", ":set-language agent-chat", "goto_file_end", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer start}"]
G = ["keep_primary_selection", ":pipe-to python3 ~/.config/helix/bin/agent-buffer capture grok new --line-start %{selection_line_start} --buffer-context \"$BASH_EXECUTION_STRING\"; exit # helix-agent-buffer: %{buffer_name}", "save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer header", "jump_backward", ":open %sh{python3 ~/.config/helix/bin/agent-buffer prepare}", ":set-language agent-chat", "goto_file_end", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer start}"]
a = ["keep_primary_selection", ":pipe-to python3 ~/.config/helix/bin/agent-buffer capture agy resume --line-start %{selection_line_start} --buffer-context \"$BASH_EXECUTION_STRING\"; exit # helix-agent-buffer: %{buffer_name}", "save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer header", "jump_backward", ":open %sh{python3 ~/.config/helix/bin/agent-buffer prepare}", ":set-language agent-chat", "goto_file_end", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer start}"]
A = ["keep_primary_selection", ":pipe-to python3 ~/.config/helix/bin/agent-buffer capture agy new --line-start %{selection_line_start} --buffer-context \"$BASH_EXECUTION_STRING\"; exit # helix-agent-buffer: %{buffer_name}", "save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer header", "jump_backward", ":open %sh{python3 ~/.config/helix/bin/agent-buffer prepare}", ":set-language agent-chat", "goto_file_end", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer start}"]
q = ["save_selection", "goto_file_start", "extend_to_line_bounds", ":pipe-to python3 ~/.config/helix/bin/agent-buffer cancel", "jump_backward", ":echo %sh{python3 ~/.config/helix/bin/agent-buffer status}"]

# ryk TTS: pipe the selection to the warm daemon (`ryk --send`), not one-shot
# `ryk`. One-shot blocks Helix until playback ends. --send returns once queued
# and auto-starts the daemon; --serve owns pacat. Helix only runs the ryk binary:
# pause / rewind / cancel live in ryk-ctl (ryk-skills), not bound here.
# :pipe-to drops the output, so nothing lands in the buffer (`::` would write the
# command line and its output into it).
k = ":pipe-to ryk --send"

# tl/td keys live under `space ,` (`space .` holds the AI tools).
# See docs/keys.md for the commands each key runs. Paths after '; exit #' are shell data.

[keys.normal.space.","]

### Time log (tl) ###

# Clock in: stop the running entry, start a new one at the end of the buffer (in todo.md, at the end of the todo you are on), normal mode at its end
i = [":open -- %sh{~/.config/helix/bin/tl running --editor \"$PPID\" --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}:%{cursor_line}}", "select_all", ":pipe ~/.config/helix/bin/tl stop - --editor \"$PPID\" --file \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", "collapse_selection", ":update", ":open -- %sh{~/.config/helix/bin/tl next --editor \"$PPID\" --skip \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}}", "select_all", ":pipe ~/.config/helix/bin/tl start - --editor \"$PPID\" --file \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", "collapse_selection", ":write!", ":open -- %sh{p=~/.cache/tl/goto-$PPID; cat \"$p\" && rm -- \"$p\"; exit}", "goto_line_end"]
# Clock in at the cursor: use a blank line, otherwise a new line below, in any buffer (todo.md too); normal mode at the entry's end
I = [":open -- %sh{~/.config/helix/bin/tl running --editor \"$PPID\" --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}:%{cursor_line}}", "select_all", ":pipe ~/.config/helix/bin/tl stop - --editor \"$PPID\" --file \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", "collapse_selection", ":update", ":open -- %sh{~/.config/helix/bin/tl next --editor \"$PPID\" --skip \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}}", "select_all", ":pipe ~/.config/helix/bin/tl start - --here --editor \"$PPID\" --file \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", "collapse_selection", ":write!", ":open -- %sh{p=~/.cache/tl/goto-$PPID; cat \"$p\" && rm -- \"$p\"; exit}", "goto_line_end"]
# Go to the running time-log entry, in whichever task file it is
o = [":open %sh{~/.config/helix/bin/tl where --visit --from %{buffer_name}:%{cursor_line}}", "select_all", ":pipe-to ~/.config/helix/bin/tl where --locate - --file %{buffer_name}", ":open %sh{cat ~/.cache/tl/goto && rm ~/.cache/tl/goto}", ":echo %sh{~/.config/helix/bin/tl where --say}"]
# Clock out: end the running entry and go to its task file, in insert mode on a "# " heading above it, to type what you did
O = [":open %sh{~/.config/helix/bin/tl out --visit --from %{buffer_name}:%{cursor_line}}", "select_all", ":pipe ~/.config/helix/bin/tl out --edit - --file %{buffer_name}", "collapse_selection", ":update", ":open %sh{cat ~/.cache/tl/goto && rm ~/.cache/tl/goto}", "insert_at_line_end"]
# Refresh durations: work out "= 1h 15min" again for the entry on the line (or in the selected lines) from its times, say after typing one by hand; a running one is ended now
u = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/tl close --file %{buffer_name}", "collapse_selection"]
# Recently changed task files, newest first, in a popup
r = ":sh ~/.config/helix/bin/tl recent"
# Time per day for all task files, from any buffer (the agenda too)
l = [":write", "align_view_top", ":sh ~/.config/helix/bin/tl summary"]
# This week's time summary in a read-only buffer (~/.cache/tl/summary.txt), to copy from
L = [":write", ":open %sh{~/.config/helix/bin/tl summary --week --view}", ":reload"]

### Todos (td) ###

# Open the configured inbox ($TD_FILE, or $TL_DIR/todo.md)
t = ":open -- %sh{~/.config/helix/bin/td inbox}"
# New todo: a "- [ ] " line at the top of todo.md, in insert mode (from anywhere, the agenda too); an empty one already first is reused
q = [":open -- %sh{~/.config/helix/bin/td inbox}", "goto_file_start", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td new - --above", "collapse_selection", "goto_file_start", "insert_at_line_end"]
# The same at the end of todo.md; an empty one already last is reused
Q = [":open -- %sh{~/.config/helix/bin/td inbox}", "goto_last_line", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td new -", "collapse_selection", "goto_last_line", "insert_at_line_end"]
# The same as q (a key can't name another key, so the list is repeated)
space = [":open -- %sh{~/.config/helix/bin/td inbox}", "goto_file_start", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td new - --above", "collapse_selection", "goto_file_start", "insert_at_line_end"]
# New file task, no todo.md bullet: type its name at the prompt; opens ~/tasks/<name>.md headed "# [ ] name"
n = "@:open %sh{~/.config/helix/bin/td file \"$BASH_EXECUTION_STRING\" # name: }<left>"
# Rename the task on an agenda row, or in its own file: its name comes up in the prompt to edit (file and heading, or bullet and file). In its own file the cursor goes to the heading
# (:goto: a key that switched buffers would lose its prompt) and the file is saved first; after Enter the same buffer follows the renamed file (:move, which only re-points it once
# td has renamed the file), so no old buffer is left, and Helix reloads the new heading when idle. On the agenda :move gets the agenda's own path and does nothing.
N = '@:update<ret>:goto %sh{~/.config/helix/bin/td rename --focus --from %{buffer_name}:%{cursor_line}}<ret>xS^\s*[-#] (?:\[.\] )?|(?: \(\*\))?\n<ret>),"ty;:move %sh{~/.config/helix/bin/td rename --from %{buffer_name}:%{cursor_line} "$BASH_EXECUTION_STRING" # name: }<left><C-r>t'
# Stamp the line: add today's date and time, or move its date to today; on the date: fix the weekday
s = [":echo %sh{mkdir -p ~/.cache/td; echo %{cursor_column} >~/.cache/td/stamp-col}", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td stamp --col $(cat ~/.cache/td/stamp-col) --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}"]
# Agenda of todo.md, newest added first (view only; the status keys work on its rows), with
# every task's subtasks folded (za toggles one). fold_all needs an hx that folds (helix
# main-kuba): another one refuses this config as an unknown command, so drop it there.
a = [":open %sh{~/.config/helix/bin/td list >/dev/null; echo ~/.cache/td/agenda.md}", ":reload", "fold_all"]
# Agenda, most recently changed first
A = [":open %sh{~/.config/helix/bin/td list --sort modified >/dev/null; echo ~/.cache/td/agenda.md}", ":reload", "fold_all"]
# Done tasks in the agenda, most recently changed first
D = [":open %sh{~/.config/helix/bin/td list --state done --sort modified >/dev/null; echo ~/.cache/td/agenda.md}", ":reload"]
# Agenda grouped by #tag, newest added first, with each tag's tasks folded
g = [":open %sh{~/.config/helix/bin/td list --by-tag >/dev/null; echo ~/.cache/td/agenda.md}", ":reload", "fold_all"]
# Agenda grouped by #tag, most recently changed first
G = [":open %sh{~/.config/helix/bin/td list --by-tag --sort modified >/dev/null; echo ~/.cache/td/agenda.md}", ":reload", "fold_all"]
# Give the bullet its own file ~/tasks/<slug>.md, and open it; in todo.md, its notes and time entries move there
P = [
  ":noop %sh{mkdir -p ~/.cache/td && printf '%%s\\n' \"${BASH_EXECUTION_STRING#*'; exit #' }\" >~/.cache/td/move-position-$PPID; exit # %{buffer_name}:%{cursor_line}:%{cursor_column}}",
  "save_selection",
  "select_all",
  ":pipe-to ~/.config/helix/bin/td editor-move promote \"$PPID\"; exit",
  ":update --no-format",
  "jump_backward",
  ":open -- %sh{~/.config/helix/bin/td move-result \"$PPID\" \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}}",
  ":echo %sh{~/.config/helix/bin/td move-result \"$PPID\" --message; exit}",
]
# Open the bullet's own file; on the agenda, its line in todo.md
p = ["extend_to_line_bounds", ":pipe-to ~/.config/helix/bin/td jump --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}:%{cursor_line}", "collapse_selection", ":open %sh{cat ~/.cache/td/open && rm ~/.cache/td/open}"]
# Move the bullet and its section (notes, time entries, subtodos) to the end of ~/tasks/day.md, ended with a zero-minute time entry that dates the move, which `space , l` lists (a [ ] or [x] bullet comes out as a # heading, with what was under it and the entry in a ``` fence, which hx folds); the buffer is saved and the cursor stays on the line it was on
ret = [
  ":noop %sh{mkdir -p ~/.cache/td && printf '%%s\\n' \"${BASH_EXECUTION_STRING#*'; exit #' }\" >~/.cache/td/move-position-$PPID; exit # %{buffer_name}:%{cursor_line}:%{cursor_column}}",
  "save_selection",
  "select_all",
  ":pipe-to ~/.config/helix/bin/td editor-move day \"$PPID\"; exit",
  ":update --no-format",
  "jump_backward",
  ":open -- %sh{~/.config/helix/bin/td move-result \"$PPID\" \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}}",
  ":echo %sh{~/.config/helix/bin/td move-result \"$PPID\" --message; exit}",
]
# Mark done (a ++/.+ repeater moves the date instead, but an hourly one); on the agenda, in todo.md
x = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle x --row %{cursor_line} --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", ":earlier %sh{[ \"${BASH_EXECUTION_STRING#*'; exit #' }\" -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0; exit # %{buffer_name}}", ":update"]

# Status keys, `space , ,` then the checkbox letter: toggle the line's state
# (on the agenda, the task's state in todo.md or its file; the agenda then reloads)
[keys.normal.space.",".","]
# Today [Y]
y = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle Y --row %{cursor_line} --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", ":earlier %sh{[ \"${BASH_EXECUTION_STRING#*'; exit #' }\" -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0; exit # %{buffer_name}}", ":update"]
# Active [A]
a = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle A --row %{cursor_line} --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", ":earlier %sh{[ \"${BASH_EXECUTION_STRING#*'; exit #' }\" -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0; exit # %{buffer_name}}", ":update"]
# Waiting [W]
w = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle W --row %{cursor_line} --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", ":earlier %sh{[ \"${BASH_EXECUTION_STRING#*'; exit #' }\" -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0; exit # %{buffer_name}}", ":update"]
# Done [x], the same as space , x
x = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle x --row %{cursor_line} --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", ":earlier %sh{[ \"${BASH_EXECUTION_STRING#*'; exit #' }\" -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0; exit # %{buffer_name}}", ":update"]
# Back to todo [ ]
space = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle todo --row %{cursor_line} --from \"${BASH_EXECUTION_STRING#*'; exit #' }\"; exit # %{buffer_name}", ":earlier %sh{[ \"${BASH_EXECUTION_STRING#*'; exit #' }\" -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0; exit # %{buffer_name}}", ":update"]
