
 theme = "github_light"
 
#theme = "acme"

[editor.soft-wrap]
enable = true
wrap-indicator = "\t"

[editor]
scroll-lines = 1
gutters = ["diagnostics", "spacer", "diff"]
shell = ["bash", "-lc"]
end-of-line-diagnostics = "disable"
auto-completion = true
completion-trigger-len = 3  
#completion-auto-select=true


completion-display = "statusline"
completion-mouse-append-whitespace = true


auto-reload = true

[editor.cursorline]
normal = true
insert = false
select = false

[editor.statusline]
left = ["mode", "spinner", "completion-suggestions", "file-name", "read-only-indicator",
  "file-modification-indicator"]


[keys.insert]
# Press 'jk' quickly to leave insert mode
#"a" = { "a" = "normal_mode" }
# "j" = { "k" = "normal_mode" }
"h" = { "h" = "normal_mode" }

[keys.normal]
C-4 = ":run-shell-command echo -n \"%(buffer_name)\" | xclip -selection clipboard"
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"
# ryk rewind: poke the live --serve daemon (~10s of already-played PCM).
# Same script Grok/Claude `/rr` will run. Needs ~/.local/bin/ryk-rewind and a
# warm daemon (first `space+. k` / `ryk --send` auto-starts it). Helix stays
# free because speak uses --send, not one-shot ryk. See kukuryku docs/rewind-plan.md.
A-r = ":sh ryk-rewind"

# td stamp keys (docs/keys.md): move the line's stamp, or a time-log entry's date/start/end, later / earlier by the part under
# the cursor; on the week summary view (space , L), show the next / previous week
"+" = [":echo %sh{mkdir -p ~/.cache/td; echo %{cursor_column} >~/.cache/td/stamp-col}", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td shift +1 --col $(cat ~/.cache/td/stamp-col) --from %{buffer_name}", ":earlier %sh{[ %{buffer_name} -ef ~/.cache/tl/summary.txt ] || [ %{buffer_name} -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0}", "collapse_selection", ":open %sh{echo %{buffer_name}:%{cursor_line}:$(cat ~/.cache/td/stamp-col)}", ":echo ''"]
"-" = [":echo %sh{mkdir -p ~/.cache/td; echo %{cursor_column} >~/.cache/td/stamp-col}", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td shift -1 --col $(cat ~/.cache/td/stamp-col) --from %{buffer_name}", ":earlier %sh{[ %{buffer_name} -ef ~/.cache/tl/summary.txt ] || [ %{buffer_name} -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0}", "collapse_selection", ":open %sh{echo %{buffer_name}:%{cursor_line}:$(cat ~/.cache/td/stamp-col)}", ":echo ''"]

[keys.normal.g]
    "\\" = ":sh echo 'https://...myaddress.../-/blob/master/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
    "|" = ":sh echo 'https://...myaddress.../-/blob/'$(git branch --show-current)'/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"

[keys.normal.space."."]
"." = ":insert-output date +\"<%%Y-%%m-%%d %%a>\""
m = ":sh echo 'https://ADDRESS/-/blob/master/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
b = ":sh echo 'https://ADDRESS/-/blob/'$(git branch --show-current)'/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
# Plain checkbox toggle [ ] ↔ [X] for any file; td's own is space , x (docs/keys.md)
x = ["extend_to_line_bounds", ":pipe sed 's/^\\([^[]*\\)\\[ \\]/\\1[X]/; t; s/^\\([^[]*\\)\\[[xX]\\]/\\1[ ]/'", ":write"]


# with std err output
# v = "@:: sh -c 'echo \"$0\" | codex exec --skip-git-repo-check resume --last -'<ret>"
# V = "@:: sh -c 'echo \"$0\" | codex exec --skip-git-repo-check -'<ret>"



v = "@:: sh -c 'echo \"$0\" | codex exec --skip-git-repo-check resume --last - 2<gt>/dev/null'<ret>"
V = "@:: sh -c 'echo \"$0\" | codex exec --skip-git-repo-check - 2<gt>/dev/null'<ret>"

# Some actions in cocontinue mode would need more permissin permissions
c = "@:: claude -c -p --permission-mode acceptEdits 2<gt>/dev/null<ret>"
C = "@:: claude -p 2<gt>/dev/null<ret>"

# grok -p takes the next arg as the prompt; keep it last so the selection is appended
g = "@:: grok -c --permission-mode acceptEdits -p 2<gt>/dev/null<ret>"
G = "@:: grok -p 2<gt>/dev/null<ret>"

# agy -p takes the next arg as the prompt; keep it last so the selection is appended
a = "@:: agy -c --dangerously-skip-permissions -p 2<gt>/dev/null<ret>"
A = "@:: agy --dangerously-skip-permissions -p 2<gt>/dev/null<ret>"

# ryk TTS: pipe the selection to the warm daemon (`ryk --send`), not one-shot
# `ryk`. One-shot blocks Helix until playback ends, so Alt-r rewind cannot
# fire while audio is playing. --send returns once queued; --serve owns pacat.
# `/spk` in Grok/Claude already --sends into the same daemon, so Alt-r also
# rewinds that speech if Helix can take the key.
k = "@:: ryk --send<ret>"

# tl/td keys live under `space ,` (`space .` holds the AI tools). One line each
# here; docs/keys.md explains every key in detail, and why each is built as it is.

[keys.normal.space.","]

### Time log (tl) ###

# Clock in: stop the running entry, start a new one at the end of the buffer
i = [":open %sh{~/.config/helix/bin/tl running --from %{buffer_name}}", "select_all", ":pipe ~/.config/helix/bin/tl stop - --file %{buffer_name}", "collapse_selection", ":update", ":open %sh{~/.config/helix/bin/tl next --skip %{buffer_name}}", "goto_last_line", "open_below", "normal_mode", ":insert-output ~/.config/helix/bin/tl start", ":write!", "insert_at_line_end"]
# Switch back: end the running entry (no heading), clock in to the task worked on before it
I = [":open %sh{~/.config/helix/bin/tl running --from %{buffer_name}}", "select_all", ":pipe ~/.config/helix/bin/tl stop - --file %{buffer_name}", "collapse_selection", ":update", ":open %sh{~/.config/helix/bin/tl next --back --skip %{buffer_name}}", "goto_last_line", "open_below", "normal_mode", ":insert-output ~/.config/helix/bin/tl start", ":write!", "insert_at_line_end"]
# Clock out: type what you did at the "# done:" prompt, Enter ends the running entry
o = "@:write-all<ret>:sh ~/.config/helix/bin/tl out \"$BASH_EXECUTION_STRING\" # done: "
# Clock out and switch back: end the running entry and clock in to the task worked on before it; type what you did at the "# done:" prompt, Enter goes there
O = "@:write-all<ret>:noop %sh{~/.config/helix/bin/tl out --back --from %{buffer_name}}<ret>:reload-all<ret>:open %sh{~/.config/helix/bin/tl note \"$BASH_EXECUTION_STRING\" # done: }<left>"
# Refresh durations: work out "= 1h 15min" again for the entry on the line (or in the selected lines) from its times, say after typing one by hand; a running one is ended now
u = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/tl close --file %{buffer_name}", "collapse_selection"]
# Recently changed task files, newest first, in a popup
r = ":sh ~/.config/helix/bin/tl recent"
# Time per day for all task files, from any buffer (the agenda too)
l = [":write", "align_view_top", ":sh ~/.config/helix/bin/tl summary"]
# This week's time summary in a read-only buffer (~/.cache/tl/summary.txt), to copy from
L = [":write", ":open %sh{~/.config/helix/bin/tl summary --week --view}", ":reload"]

### Todos (td) ###

# Open the inbox, ~/tasks/todo.md
t = ":open ~/tasks/todo.md"
# New todo: a "- [ ] " line at the top of todo.md, in insert mode (from anywhere, the agenda too); an empty one already first is reused
q = [":open ~/tasks/todo.md", "goto_file_start", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td new - --above", "collapse_selection", "goto_file_start", "insert_at_line_end"]
# The same at the end of todo.md; an empty one already last is reused
Q = [":open ~/tasks/todo.md", "goto_last_line", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td new -", "collapse_selection", "goto_last_line", "insert_at_line_end"]
# The same as q (a key can't name another key, so the list is repeated)
space = [":open ~/tasks/todo.md", "goto_file_start", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td new - --above", "collapse_selection", "goto_file_start", "insert_at_line_end"]
# New file task, no todo.md bullet: type its name at the prompt; opens ~/tasks/<name>.md headed "# [ ] name"
n = "@:open %sh{~/.config/helix/bin/td file \"$BASH_EXECUTION_STRING\" # name: }<left>"
# Rename the task on an agenda row: its name comes up in the prompt to edit (file and heading, or bullet and file)
N = '@xS^- (?:\[.\] )?|(?:  \S+:\d+:\d+| \(\*\))?\n<ret>),"ty;:open %sh{~/.config/helix/bin/td rename --from %{buffer_name}:%{cursor_line} "$BASH_EXECUTION_STRING" # name: }<left><C-r>t'
# Stamp the line: add today's date and time, or move its date to today; on the date: fix the weekday
s = [":echo %sh{mkdir -p ~/.cache/td; echo %{cursor_column} >~/.cache/td/stamp-col}", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td stamp --col $(cat ~/.cache/td/stamp-col) --from %{buffer_name}"]
# Agenda of todo.md, newest added first (view only; the status keys work on its rows)
a = [":open %sh{~/.config/helix/bin/td list >/dev/null; echo ~/.cache/td/agenda.md}", ":reload"]
# Agenda, most recently changed first
A = [":open %sh{~/.config/helix/bin/td list --sort modified >/dev/null; echo ~/.cache/td/agenda.md}", ":reload"]
# Done tasks in the agenda, most recently changed first
D = [":open %sh{~/.config/helix/bin/td list --state done --sort modified >/dev/null; echo ~/.cache/td/agenda.md}", ":reload"]
# Give the bullet its own file ~/tasks/<slug>.md, and open it
P = [":update", "extend_to_line_bounds", ":pipe-to ~/.config/helix/bin/td promote --from %{buffer_name}:%{cursor_line}", "collapse_selection", ":open %sh{cat ~/.cache/td/open && rm ~/.cache/td/open}"]
# Open the bullet's own file; on the agenda, its line in todo.md
p = ["extend_to_line_bounds", ":pipe-to ~/.config/helix/bin/td jump --from %{buffer_name}:%{cursor_line}", "collapse_selection", ":open %sh{cat ~/.cache/td/open && rm ~/.cache/td/open}"]
# Mark done (a ++/.+ repeater moves the date instead, but an hourly one); on the agenda, in todo.md
x = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle x --from %{buffer_name}", ":earlier %sh{[ %{buffer_name} -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0}", ":update"]

# Status keys, `space , ,` then the checkbox letter: toggle the line's state
# (on the agenda, the task's state in todo.md or its file; the agenda then reloads)
[keys.normal.space.",".","]
# Today [Y]
y = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle Y --from %{buffer_name}", ":earlier %sh{[ %{buffer_name} -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0}", ":update"]
# Active [A]
a = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle A --from %{buffer_name}", ":earlier %sh{[ %{buffer_name} -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0}", ":update"]
# Waiting [W]
w = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle W --from %{buffer_name}", ":earlier %sh{[ %{buffer_name} -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0}", ":update"]
# Done [x], the same as space , x
x = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle x --from %{buffer_name}", ":earlier %sh{[ %{buffer_name} -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0}", ":update"]
# Back to todo [ ]
space = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle todo --from %{buffer_name}", ":earlier %sh{[ %{buffer_name} -ef ~/.cache/td/agenda.md ] && echo 1 || echo 0}", ":update"]
