
 theme = "github_light"
 
#theme = "acme"

[editor.soft-wrap]
enable = true
wrap-indicator = "\t"

[editor]
scroll-lines = 1
gutters = ["diagnostics", "spacer", "diff"]
shell = ["bash", "-lc"]
end-of-line-diagnostics = "disable"
auto-completion = true
completion-trigger-len = 3  
#completion-auto-select=true


completion-display = "statusline"
completion-mouse-append-whitespace = true


auto-reload = true

[editor.cursorline]
normal = true
insert = false
select = false

[editor.statusline]
left = ["mode", "spinner", "completion-suggestions", "file-name", "read-only-indicator",
  "file-modification-indicator"]


[keys.insert]
# Press 'jk' quickly to leave insert mode
#"a" = { "a" = "normal_mode" }
# "j" = { "k" = "normal_mode" }
"h" = { "h" = "normal_mode" }

[keys.normal]
C-4 = ":run-shell-command echo -n \"%(buffer_name)\" | xclip -selection clipboard"
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"
# ryk rewind: poke the live --serve daemon (~10s of already-played PCM).
# Same script Grok/Claude `/rr` will run. Needs ~/.local/bin/ryk-rewind and a
# warm daemon (first `space+. d` / `ryk --send` auto-starts it). Helix stays
# free because speak uses --send, not one-shot ryk. See kukuryku docs/rewind-plan.md.
A-r = ":sh ryk-rewind"

[keys.normal.g]
    "\\" = ":sh echo 'https://...myaddress.../-/blob/master/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
    "|" = ":sh echo 'https://...myaddress.../-/blob/'$(git branch --show-current)'/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"


[keys.normal.space."."]
"." = ":insert-output date +\"<%%Y-%%m-%%d %%a>\""
m = ":sh echo 'https://ADDRESS/-/blob/master/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
b = ":sh echo 'https://ADDRESS/-/blob/'$(git branch --show-current)'/%{buffer_name}#L%{cursor_line}' | xclip -selection clipboard"
# Toggle the line's checkbox [ ] ↔ [X] ([x] unticks too). Works with no selection: the
# whole line is piped. Only the first bracket on the line counts, and only if it is a checkbox.
x = ["extend_to_line_bounds", ":pipe sed 's/^\\([^[]*\\)\\[ \\]/\\1[X]/; t; s/^\\([^[]*\\)\\[[xX]\\]/\\1[ ]/'", ":write"]


# with std err output
# v = "@:: sh -c 'echo \"$0\" | codex exec --skip-git-repo-check resume --last -'<ret>"
# V = "@:: sh -c 'echo \"$0\" | codex exec --skip-git-repo-check -'<ret>"



v = "@:: sh -c 'echo \"$0\" | codex exec --skip-git-repo-check resume --last - 2<gt>/dev/null'<ret>"
V = "@:: sh -c 'echo \"$0\" | codex exec --skip-git-repo-check - 2<gt>/dev/null'<ret>"

# Some actions in cocontinue mode would need more permissin permissions
c = "@:: claude -c -p --permission-mode acceptEdits 2<gt>/dev/null<ret>"
C = "@:: claude -p 2<gt>/dev/null<ret>"

# grok -p takes the next arg as the prompt; keep it last so the selection is appended
g = "@:: grok -c --permission-mode acceptEdits -p 2<gt>/dev/null<ret>"
G = "@:: grok -p 2<gt>/dev/null<ret>"

# agy -p takes the next arg as the prompt; keep it last so the selection is appended
a = "@:: agy -c --dangerously-skip-permissions -p 2<gt>/dev/null<ret>"
A = "@:: agy --dangerously-skip-permissions -p 2<gt>/dev/null<ret>"

# ryk TTS: pipe the selection to the warm daemon (`ryk --send`), not one-shot
# `ryk`. One-shot blocks Helix until playback ends, so Alt-r rewind cannot
# fire while audio is playing. --send returns once queued; --serve owns pacat.
# `/spk` in Grok/Claude already --sends into the same daemon, so Alt-r also
# rewinds that speech if Helix can take the key.
d = "@:: /data/data/com.termux/files/home/PRJ/kukuryku/target/release/ryk --send<ret>"

# tl/td bindings live under `space ,` to avoid clashing with the AI-tool
# bindings on `space .` (c/C/g/G/a/A/v/V/d).

[keys.normal.space.","]

### Time logging ###

# Time log helper for ~/.config/helix/bin/tl, task files in $TL_DIR, default ~/tasks
# Start a new entry at the end of the buffer, so the latest is always last: "YYYY-MM-DD HH:MM - " then type the note.
# First stops entries still running (started <12h ago): other task files on disk, this buffer via :pipe
# (not :write + disk: a write in a key sequence lands only after the sequence). td's inbox is left alone,
# on disk and as this buffer: a `- [ ] 2026-10-12 09:00 - …` bullet there is a todo, not a running entry.
i = [":echo %sh{~/.config/helix/bin/tl stop --skip %{buffer_name}}", "select_all", ":pipe ~/.config/helix/bin/tl stop - --file %{buffer_name}", "goto_last_line", "open_below", "normal_mode", ":insert-output ~/.config/helix/bin/tl start", "insert_at_line_end"]
# Clock out: saves all, then waits in the command prompt for what you did ("# done: "); Enter ends the running
# entry, whichever task file it is in, on disk (auto-reload shows it), with that text as its "# heading" bullet.
# Empty: no heading. Esc: nothing happens. The text is a shell comment read back from $BASH_EXECUTION_STRING, so it
# needs no quoting; only "%" is special (Helix expansions), "%%" types one. A macro so the prompt stays open.
o = "@:write-all<ret>:sh ~/.config/helix/bin/tl out \"$BASH_EXECUTION_STRING\" # done: "
# Recently modified task files, newest first, in a popup (no new buffer): open one with :o <path>
r = ":sh ~/.config/helix/bin/tl recent"
# Per-day summary of all task files, or just this file if it is not in the task folder (saves first so unsaved entries count)
# align_view_top (zt) first: a popup opens below the cursor's screen row when 6 rows fit there, so it gets the full height.
S = [":write", "align_view_top", ":sh ~/.config/helix/bin/tl summary --file %{buffer_name}"]

### TODO scheduler ###

# td — ~/.config/helix/bin/td. Inbox bullets live in $TD_FILE (default ~/tasks/todo.md).
# States live in the checkbox: [ ] todo  [Y] today  [A] active  [x] done  [!] ignore.
# Any `YYYY-MM-DD HH:MM` on an open inbox bullet or in a dedicated file (not tagged
# [x]/[!]) fires a Termux notification; a tl entry's leading time does not.
# Install the 15-min job once from the shell: `td install`.

# Open the inbox file.
t = ":open ~/tasks/todo.md"
# Stamp the current line via `td stamp` (whole-line :pipe). Behaviour:
#   • No date on the line  → appends "YYYY-MM-DD Xxx HH:MM" at the end.
#   • Existing date+time   → replaces the date with today's (keeps the
#                            time, keeps/fixes the weekday).
#   • Cursor on that date  → you edited it by hand: keeps the date and only
#                            fixes the weekday.
#   • tl log entries (a line starting `YYYY-MM-DD HH:MM - ...`) are left alone
#     and a fresh stamp is appended, since those lines are history, not schedules.
# extend_to_line_bounds moves the cursor to the line end, so the column is saved first.
s = [":echo %sh{mkdir -p ~/.cache/td; echo %{cursor_column} >~/.cache/td/stamp-col}", "extend_to_line_bounds", ":pipe ~/.config/helix/bin/td stamp --col $(cat ~/.cache/td/stamp-col)"]
# Reusable agenda buffer, grouped ACTIVE / TODAY / TODO, newest-added at the top.
# auto-reload = true refreshes the same buffer on re-run (no new window). td runs
# inside %sh{} so it finishes before :open; with `:sh` (async) the buffer showed
# the previous run's agenda.
a = [":open %sh{~/.config/helix/bin/td list >/dev/null; echo ~/.cache/td/agenda.md}"]
# Same agenda, most recently changed at the top: a bullet's line (state, text, stamp)
# or its dedicated file. Edits by hand count from the next td run (a, A, or a toggle).
A = [":open %sh{~/.config/helix/bin/td list --sort modified >/dev/null; echo ~/.cache/td/agenda.md}"]
# Promote the current bullet to a dedicated ~/tasks/<slug>.md file (reuses if exists).
# `:write` first so td reads a fresh file; td creates/reuses the dedicated file
# and refreshes agenda.md on disk (auto-reload picks up the new ' (*)'
# marker). Finally :open jumps into the dedicated file.
P = [":write", ":sh ~/.config/helix/bin/td promote --from %{buffer_name} --line %{cursor_line}", ":open %sh{~/.config/helix/bin/td jump --from %{buffer_name}:%{cursor_line}}"]
# Jump: slugify the current bullet, open ~/tasks/<slug>.md if it exists. From an
# agenda row without one, open the inbox at that bullet's line. Otherwise `td jump`
# prints the current buffer path, so :open becomes a no-op reopen.
p = ":open %sh{~/.config/helix/bin/td jump --from %{buffer_name}:%{cursor_line}}"
# Toggle state of the current line. The line goes through td with :pipe, so the
# change shows at once and unsaved edits are kept, then :write saves. (Running td
# on the file instead races Helix's background save: the edits are lost.) From
# another file, td also toggles the matching inbox bullet. From the agenda, td
# toggles the inbox line that row shows (exact text match); the row changes in
# place and `space , a` regroups. If the agenda is out of date and nothing
# matches, the row gets "← agenda out of date: space , a" and nothing changes.
# Y toggles [Y] today; L toggles [A] active (`A` is the modified-sort agenda).
Y = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle Y --from %{buffer_name}", ":write"]
L = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle A --from %{buffer_name}", ":write"]
# Mark done. If the line has an org-style ++Nu or .+Nu repeater
# (u = d|w|m|y), the stamped date is bumped instead and state stays [ ]:
#   ++1m   anchored: new = old_date + 1m (repeat until future). "rent on the 1st"
#   .+2w   floating: new = today + 2w, time-of-day preserved. "water plants"
# Note: this is a td-aware alternative to `space . x` (plain sed toggle, [X]).
x = ["extend_to_line_bounds", ":pipe ~/.config/helix/bin/td toggle x --from %{buffer_name}", ":write"]
# Fire a tick manually — useful while testing schedules without waiting for the
# 15-min job. Runs the same code the scheduler would.
ret = [":write", ":sh ~/.config/helix/bin/td-tick"]
